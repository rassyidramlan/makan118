name: Deploy

on:
  push:
    branches: [main]

jobs:
  inject-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject API key
        run: |
          sed -i 's/REPLACE_WITH_YOUR_KEY/${{ secrets.MAPS_KEY }}/g' index.html

      - name: Commit injected file
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git diff --staged --quiet && echo "Nothing to commit, skipping" || (git commit -m "Inject API key [skip ci]" && git push)
