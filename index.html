<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Makan@118</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2d3148;
    --accent: #ff6b35;
    --accent2: #ffb347;
    --halal-green: #22c55e;
    --halal-amber: #f59e0b;
    --halal-red: #ef4444;
    --text: #e8eaf2;
    --text-muted: #7c8098;
    --text-dim: #4a4f6a;
    --map-w: 58%;
    --panel-w: 42%;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
  }

  /* ── LEFT PANEL ── */
  #panel {
    width: var(--panel-w);
    height: 100vh;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    overflow: hidden;
  }

  #header {
    padding: 16px 18px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  #header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }
  #header h1 span { color: var(--accent); }

  #header .sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
    font-family: 'DM Mono', monospace;
  }

  /* search bar */
  #search-row {
    display: flex;
    gap: 8px;
    padding: 10px 18px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  #search-row input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text);
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
  }
  #search-row input:focus { border-color: var(--accent); }
  #search-row input::placeholder { color: var(--text-dim); }

  #search-row button {
    background: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    font-family: 'DM Sans', sans-serif;
  }
  #search-row button:hover { background: #e05a28; }

  /* filter chips */
  #filter-row {
    display: flex;
    gap: 6px;
    padding: 8px 18px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    flex-shrink: 0;
    scrollbar-width: none;
  }
  #filter-row::-webkit-scrollbar { display: none; }

  .chip {
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    background: transparent;
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    transition: all .15s;
  }
  .chip.active, .chip:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .chip.halal-chip.active { background: var(--halal-green); border-color: var(--halal-green); }

  /* sort row */
  #sort-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 18px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #sort-row .label { font-size: 11px; color: var(--text-muted); }
  #sort-row select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 8px;
    color: var(--text);
    font-size: 11px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    cursor: pointer;
  }
  #sort-row .count {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
  }

  /* place list */
  #list {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .place-card {
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    gap: 12px;
    transition: background .12s;
    position: relative;
  }
  .place-card:hover { background: var(--surface); }
  .place-card.selected { background: var(--surface2); border-left: 3px solid var(--accent); }

  .place-thumb {
    width: 56px;
    height: 56px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--surface2);
  }
  .place-thumb-placeholder {
    width: 56px;
    height: 56px;
    border-radius: 8px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .place-info { flex: 1; min-width: 0; }

  .place-name {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .place-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 3px;
    flex-wrap: wrap;
  }

  .rating {
    font-size: 11px;
    color: var(--accent2);
    font-weight: 500;
  }

  .halal-badge {
    font-size: 10px;
    font-weight: 600;
    font-family: 'DM Mono', monospace;
    padding: 1px 6px;
    border-radius: 4px;
    letter-spacing: .3px;
  }
  .halal-likely { background: rgba(34,197,94,.18); color: var(--halal-green); }
  .halal-check  { background: rgba(245,158,11,.18); color: var(--halal-amber); }
  .halal-unsure { background: rgba(239,68,68,.18);  color: var(--halal-red); }

  .mall-badge {
    font-size: 10px;
    background: rgba(99,102,241,.2);
    color: #818cf8;
    padding: 1px 6px;
    border-radius: 4px;
    font-weight: 500;
  }

  .place-addr {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .place-travel {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 3px;
    font-family: 'DM Mono', monospace;
  }
  .place-travel .walk { color: #60a5fa; }
  .place-travel .drive { color: #a78bfa; }

  /* detail panel overlay */
  #detail {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    max-height: 72vh;
    background: var(--surface);
    border-top: 2px solid var(--accent);
    border-radius: 16px 16px 0 0;
    overflow-y: auto;
    z-index: 100;
    padding: 20px 20px 32px;
    box-shadow: 0 -8px 40px rgba(0,0,0,.5);
    transition: transform .25s ease;
  }

  .detail-close {
    position: absolute;
    top: 14px; right: 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-muted);
  }

  .detail-photos {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-bottom: 14px;
    scrollbar-width: none;
  }
  .detail-photos::-webkit-scrollbar { display: none; }
  .detail-photos img {
    height: 120px;
    border-radius: 10px;
    object-fit: cover;
    flex-shrink: 0;
  }

  .detail-name { font-size: 17px; font-weight: 600; margin-bottom: 6px; }

  .detail-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }

  .detail-section { margin-bottom: 14px; }
  .detail-section .sec-title {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
    font-family: 'DM Mono', monospace;
  }

  .detail-row {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 4px;
    display: flex;
    gap: 6px;
  }
  .detail-row span:first-child { color: var(--text-dim); width: 16px; text-align: center; }

  .hours-list { font-size: 11px; color: var(--text-muted); line-height: 1.8; }
  .hours-today { color: var(--accent2); font-weight: 500; }

  .travel-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .travel-box {
    background: var(--surface2);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .travel-box .mode { font-size: 10px; color: var(--text-dim); font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
  .travel-box .dur  { font-size: 16px; font-weight: 600; }
  .travel-box .dist { font-size: 11px; color: var(--text-muted); }

  .directions-btn {
    display: inline-block;
    margin-top: 10px;
    padding: 8px 16px;
    background: var(--accent);
    color: #fff;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    border: none;
    font-family: 'DM Sans', sans-serif;
  }
  .directions-btn:hover { background: #e05a28; }

  /* map */
  #map {
    width: var(--map-w);
    height: 100vh;
  }

  /* loading / empty */
  .state-msg {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 200px;
    gap: 10px;
    color: var(--text-dim);
    font-size: 13px;
  }
  .spinner {
    width: 28px; height: 28px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* scrollbar */
  #list::-webkit-scrollbar { width: 4px; }
  #list::-webkit-scrollbar-track { background: transparent; }
  #list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* mobile */
  @media (max-width: 700px) {
    body { flex-direction: column; overflow: auto; }
    #panel { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
    #map { width: 100%; height: 45vh; }
    body { height: auto; }
    #list { max-height: 50vh; }
  }
</style>
</head>
<body>
<div id="panel">
  <div id="root"></div>
</div>
<div id="map"></div>

<script>
window.CONFIG = {

</script>

<script src="https://maps.googleapis.com/maps/api/js?key=REPLACE_WITH_YOUR_KEY&libraries=places"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
